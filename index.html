<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkMate - Weather & News</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Splash Screen -->
        <div class="splash-screen" id="splashScreen">
            <div class="splash-content">
                <div class="splash-icon">
                    <i class="fas fa-cloud-sun"></i>
                </div>
                <h1 class="splash-title">TalkMate</h1>
                <p class="splash-subtitle">Weather & News</p>
                <div class="loader"></div>
            </div>
        </div>

        <!-- Main App -->
        <div class="main-app" id="mainApp">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <div class="logo">
                        <i class="fas fa-cloud-sun"></i>
                        <span>TalkMate</span>
                    </div>
                    <div class="header-actions">
                        <button class="theme-toggle" id="themeToggle">
                            <i class="fas fa-moon"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Weather Section -->
                <section class="weather-section" id="weatherSection">
                    <div class="section-header">
                        <h2>🌤 Weather</h2>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Tokyo, New York)" value="London">
                            <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>

                    <div class="weather-card" id="weatherCard">
                        <div class="loading">Loading weather data...</div>
                    </div>
                </section>

                <!-- News Section -->
                <section class="news-section" id="newsSection">
                    <div class="section-header">
                        <h2>📰 News</h2>
                        <div class="category-tabs">
                            <button class="category-btn active" data-category="general">Top</button>
                            <button class="category-btn" data-category="technology">Tech</button>
                            <button class="category-btn" data-category="business">Business</button>
                            <button class="category-btn" data-category="sports">Sports</button>
                            <button class="category-btn" data-category="entertainment">Entertainment</button>
                        </div>
                    </div>

                    <div class="news-grid" id="newsGrid">
                        <div class="loading">Loading news...</div>
                    </div>
                </section>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <p>Created by <strong>Farid Ahmad Khan</strong> | Khan AI Solutions</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
